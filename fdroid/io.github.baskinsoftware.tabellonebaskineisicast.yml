# ─────────────────────────────────────────────────────────────────────────────
# Metadati per la candidatura a F-Droid.
#
# ATTENZIONE: questo file NON va nel repo dell'app — è una COPIA DI LAVORO.
# Il file "vero" va inviato come merge request al repository dei metadati:
#
#     https://gitlab.com/fdroid/fdroiddata
#     percorso: metadata/io.github.baskinsoftware.tabellonebaskineisicast.yml
#
# Lo teniamo qui versionato per non doverlo riscrivere ad ogni release e per
# tenere traccia di cosa è stato dichiarato a F-Droid.
#
# Riferimento campi: https://f-droid.org/docs/Build_Metadata_Reference/
# ─────────────────────────────────────────────────────────────────────────────

Categories:
  - Sports & Health
License: MIT
AuthorName: Daniele Lolli (UncleDan)
SourceCode: https://github.com/baskinsoftware/tabellone-baskin-eisi-cast
IssueTracker: https://github.com/baskinsoftware/tabellone-baskin-eisi-cast/issues
Changelog: https://github.com/baskinsoftware/tabellone-baskin-eisi-cast/releases

# Descrizioni e screenshot NON vanno ripetuti qui: F-Droid li legge da solo
# dalla cartella fastlane/metadata/android/<locale>/ del repo dell'app.

RepoType: git
Repo: https://github.com/baskinsoftware/tabellone-baskin-eisi-cast.git

Builds:
  - versionName: '26.1'
    versionCode: 260100
    commit: v26.1
    subdir: app
    gradle:
      - yes

  - versionName: '26.1.2'
    versionCode: 260102099
    commit: v26.1.2
    subdir: app
    gradle:
      - yes

# Nota sul versionName: dalla 26.1.2 il Cast segue la regola di versioning
# Baskin v3, AA.M[.P][.W][bN]: il numero rispecchia la PWA incorporata e W e' la
# revisione del solo wrapper (PWA 26.1.2 -> Cast 26.1.2 -> 26.1.2.1).
# versionCode a 9 cifre, AA MM PP W BB, con BB = 01..98 per le pre-release e 99
# per la finale (26.1.2 -> 260102099). Le versioni fino alla 26.1.1 usavano lo
# schema precedente a 6 cifre (260100, 260101).
#
# Rispetto al vecchio schema a "doppia versione" ("1.3.3 (PWA 2026d)"), il
# versionName è ora una stringa semplice assegnata da una variabile gradle:
# fdroidserver riesce a leggerla, quindi l'aggiornamento automatico dei
# metadati può funzionare. Resta comunque prudente verificare i primi
# aggiornamenti automatici prima di fidarsi del tutto.
AutoUpdateMode: Version
# Il filtro esclude di proposito i tag delle beta (es. v26.1.2b1), che
# contengono una lettera: F-Droid impacchetta solo le release finali.
UpdateCheckMode: Tags ^v[0-9.]+$

CurrentVersion: '26.1.2'
CurrentVersionCode: 260102099
