# app-android.yml by Daniele Lolli (UncleDan) feat. Claude AI - Release 1.0 - 2026-11-21 20-53-16
#
# App Android nativa (progetto Gradle nella radice del repository).
#   - push su beta       -> APK di prova nella pre-release «app-beta» (sempre la più recente)
#   - tag v* (es. v26.1) -> APK nella release del tag
#   - ogni esecuzione    -> APK anche tra gli artifact dell'esecuzione
# Senza secret di firma si produce l'APK «debug» (installabile, firma di sviluppo).
# Con i secret KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD si
# produce anche l'APK «release» firmato con la chiave del progetto.
#
# Differenze rispetto all'omonimo workflow della PWA: qui non c'è Capacitor, quindi
# niente npm/node e nessun «cap sync»; il progetto Android è già nella radice e la
# versione si legge da «appVersion» in app/build.gradle invece che da uno script.
name: App Android

on:
  push:
    branches: ["beta", "main"]
    tags: ["v*"]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/app-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Versione dell'app
        shell: bash
        run: |
          set -euo pipefail
          APP_VER="$(sed -nE 's/^[[:space:]]*def appVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle | head -1)"
          [ -n "$APP_VER" ] || { echo "::error::appVersion non trovata in app/build.gradle"; exit 1; }
          echo "APP_VER=$APP_VER" >> "$GITHUB_ENV"
          echo "Versione: $APP_VER"
          # Su un tag, segnala (senza bloccare) se il tag non corrisponde alla versione
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$APP_VER" ]; then
            echo "::warning::Il tag ${GITHUB_REF_NAME} non corrisponde ad appVersion ${APP_VER}"
          fi

      - name: APK debug
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: APK release firmato (se ci sono i secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Nessun keystore: solo APK debug"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease

      - name: Raccoglie gli APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/Tabellone-Baskin-EISI-Cast-${APP_VER}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/Tabellone-Baskin-EISI-Cast-${APP_VER}.apk"
          fi
          ls -la out

      - name: Pulisce il keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v5
        with:
          name: Tabellone-Baskin-EISI-Cast-${{ env.APP_VER }}-android
          path: out/

      - name: Aggiorna il tag app-beta
        if: github.ref == 'refs/heads/beta'
        run: |
          git tag -f app-beta
          git push -f origin app-beta

      - name: Pre-release app-beta
        if: github.ref == 'refs/heads/beta'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-beta
          name: App beta ${{ env.APP_VER }}
          prerelease: true
          make_latest: false
          body: |
            Versione di prova **${{ env.APP_VER }}** dell'app (ramo beta, commit ${{ github.sha }}).
            Android: scarica l'APK e aprilo dal telefono (consenti l'installazione da questa fonte).
          files: out/*.apk

      - name: Release del tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'b') }}
          files: out/*.apk
