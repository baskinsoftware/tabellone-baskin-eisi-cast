# beta.yml by Daniele Lolli (UncleDan) feat. Claude AI - Release 1.2 - 2026-11-27 16-33-00
#
name: Beta APK (unsigned)

# Compila un APK di RELEASE NON FIRMATO, senza bisogno di keystore né segreti.
# Il buildType "release", in assenza della variabile d'ambiente
# TBE_KEYSTORE_PATH (dalla 26.1.1; prima si chiamava KEYSTORE_FILE), non
# dichiara nemmeno il signingConfig: Gradle produce "app-release-unsigned.apk".
#
# Si avvia:
#  - a mano dal tab "Actions" → "Beta APK (unsigned)" → "Run workflow";
#  - automaticamente ad ogni push sul branch "beta".
#
# L'APK resta come "artifact" scaricabile dalla pagina del run (non pubblicato
# in una Release). ATTENZIONE: essendo NON firmato, va firmato con apksigner
# prima di poterlo installare su un dispositivo.

on:
  workflow_dispatch:
  push:
    branches:
      - beta

permissions:
  contents: read

concurrency:
  group: beta-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Solo in CI: le richieste a Maven Central passano dal mirror pubblico di Google,
      # che non risponde 429 ai runner condivisi di GitHub. Il progetto non cambia.
      # Stesso accorgimento di app-android.yml nel repository della PWA.
      - name: Mirror di Maven Central per Gradle
        env:
          MAVEN_MIRROR: https://maven-central.storage-download.googleapis.com/maven2/
        run: |
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          cat > "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d/maven-central-mirror.gradle" <<EOF
          def mirror = '${MAVEN_MIRROR}'
          def redirect = { repos ->
            repos.withType(MavenArtifactRepository).configureEach { r ->
              def u = r.url.toString()
              if (u.startsWith('https://repo.maven.apache.org/maven2') || u.startsWith('https://repo1.maven.org/maven2')) r.url = mirror
            }
          }
          beforeSettings { s ->
            redirect(s.pluginManagement.repositories)
            redirect(s.dependencyResolutionManagement.repositories)
          }
          allprojects {
            redirect(buildscript.repositories)
            redirect(repositories)
          }
          EOF

      - name: Build APK release NON firmato
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Prepara l'artifact
        run: |
          mkdir -p out
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             "out/TabelloneBaskinCast-beta-${GITHUB_SHA::7}-unsigned.apk"

      - name: Carica l'APK beta come artifact
        uses: actions/upload-artifact@v5
        with:
          name: TabelloneBaskinCast-beta-${{ env.SHORT_SHA }}-unsigned
          path: out/*.apk
