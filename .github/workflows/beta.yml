name: Beta APK (unsigned)

# Compila un APK di RELEASE NON FIRMATO, senza bisogno di keystore né segreti.
# Il buildType "release", in assenza della variabile d'ambiente KEYSTORE_FILE,
# non applica alcuna firma: Gradle produce "app-release-unsigned.apk".
#
# Si avvia:
#  - a mano dal tab "Actions" → "Beta APK (unsigned)" → "Run workflow";
#  - automaticamente ad ogni push sul branch "beta".
#
# L'APK resta come "artifact" scaricabile dalla pagina del run (non pubblicato
# in una Release). ATTENZIONE: essendo NON firmato, va firmato con apksigner
# prima di poterlo installare su un dispositivo.

on:
  workflow_dispatch:
  push:
    branches:
      - beta

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK release NON firmato
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Prepara l'artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             "out/TabelloneBaskinCast-beta-${GITHUB_SHA::7}-unsigned.apk"

      - name: Carica l'APK beta come artifact
        uses: actions/upload-artifact@v4
        with:
          name: TabelloneBaskinCast-beta-unsigned
          path: out/*.apk
