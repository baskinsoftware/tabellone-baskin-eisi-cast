# play-prepare.yml by Daniele Lolli (UncleDan) feat. Claude AI - Release 1.1 - 2026-11-27 15-59-23
#
name: Prepara AAB per Google Play

# Compila e firma l'Android App Bundle (.aab) richiesto da Google Play Console.
# NON pubblica nulla automaticamente: l'AAB viene solo caricato come artifact
# del workflow, pronto per l'upload MANUALE su Play Console.
#
# Perché manuale: la primissima release di un'app su Play Console va sempre
# caricata a mano (Google non permette di creare l'app via API). Una volta che
# l'app esiste con almeno una release, si potrà valutare un secondo workflow
# che pubblica automaticamente via Google Play Developer API (richiede un
# Service Account con permessi sulla Play Console).
#
# Il parametro "track" qui è solo INFORMATIVO: serve a etichettare l'AAB con
# il canale a cui è destinato (internal / alpha / beta / production), così in
# Play Console selezioni il track giusto durante l'upload manuale.
#
# Segreti richiesti (Settings → Secrets and variables → Actions), STESSI di
# release.yml — stesso keystore usato per firmare gli APK:
#   KEYSTORE_BASE64     il tuo keystore .jks codificato in base64
#   KEYSTORE_PASSWORD   password dello store
#   KEY_ALIAS           alias della chiave
#   KEY_PASSWORD        password della chiave
#
# Dalla 26.1.1 i segreti vengono passati a Gradle con i nomi TBE_* (gli stessi
# dell'app Android della PWA): cambia solo il nome delle variabili, non quello
# dei segreti.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Track Google Play di destinazione (solo etichetta, upload resta manuale)'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal

permissions:
  contents: read

concurrency:
  group: play-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Decodifica keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build AAB release firmato
        env:
          TBE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          TBE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TBE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TBE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease

      - name: Determina track e nome versione
        run: |
          TRACK="${{ inputs.track }}"
          if [ -z "$TRACK" ]; then TRACK="internal"; fi
          echo "TRACK=$TRACK" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION_LABEL=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION_LABEL=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Rinomina AAB con versione e track
        run: |
          mkdir -p out
          cp app/build/outputs/bundle/release/app-release.aab \
             "out/TabelloneBaskinCast-${VERSION_LABEL}-${TRACK}-signed.aab"

      - name: Pulisci keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Carica l'AAB come artifact
        uses: actions/upload-artifact@v5
        with:
          name: TabelloneBaskinCast-${{ env.VERSION_LABEL }}-${{ env.TRACK }}-signed
          path: out/*.aab
