name: Release APK

# Compila, firma e allega l'APK alla Release di GitHub quando pubblichi un tag "v*".
#
# Titolo e testo della Release seguono la regola del progetto: titolo = primo
# titolo "# " del README + spazio + tag (es. "Tabellone Baskin EISI (Cast) v26.1"),
# testo = il README dalla prima riga non vuota dopo quel titolo.
#
# Segreti richiesti nel repository (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64     il tuo keystore .jks codificato in base64
#                       (genera con:  base64 -w0 mio.jks   oppure  base64 mio.jks )
#   KEYSTORE_PASSWORD   password dello store
#   KEY_ALIAS           alias della chiave
#   KEY_PASSWORD        password della chiave
#
# La chiave NON entra mai nel repository: viene ricostruita in RAM durante la build.

on:
  push:
    tags:
      - 'v*'
  # Avviabile anche a mano su un tag: serve a "Crea release" (crea-release.yml),
  # perche' un tag creato con GITHUB_TOKEN non fa partire i trigger "push: tags".
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decodifica keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

      - name: Build APK release firmato
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rinomina APK con la versione del tag
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/TabelloneBaskinCast-${GITHUB_REF_NAME}-signed.apk"

      - name: Pulisci keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"

      - name: Titolo e testo della Release dal README
        id: note
        shell: bash
        run: |
          set -euo pipefail
          # Regola: titolo = primo titolo "# " del README + spazio + tag;
          # testo = il README dalla prima riga non vuota dopo quel titolo.
          [ -f README.md ] || { echo "::error::README.md non trovato"; exit 1; }
          RIGA="$(grep -n -m1 -E '^# ' README.md | cut -d: -f1 || true)"
          [ -n "$RIGA" ] || { echo "::error::Nessun titolo '# ' in README.md"; exit 1; }
          TITOLO="$(sed -n "${RIGA}p" README.md | sed -E 's/^# +//; s/\r$//; s/[[:space:]]+$//')"
          NOTE="$RUNNER_TEMP/note-release.md"
          tail -n +"$((RIGA + 1))" README.md \
            | awk 'BEGIN{p=0} { if (!p && $0 ~ /^[[:space:]\r]*$/) next; p=1; print }' > "$NOTE"
          echo "nome=${TITOLO} ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "note=$NOTE" >> "$GITHUB_OUTPUT"
          echo "- **Titolo Release:** ${TITOLO} ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"

      - name: Allega l'APK alla Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.note.outputs.nome }}
          body_path: ${{ steps.note.outputs.note }}
          files: out/*.apk
