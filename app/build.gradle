plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.baskinsoftware.tabellonebaskineisicast'
    compileSdk 34

    // ── Versioning Baskin v3 ────────────────────────────────────────────────
    // Dalla 26.1.2 il Cast segue la regola unica dei progetti Baskin:
    //
    //   AA.M[.P][.W][bN]
    //     AA  anno a due cifre
    //     M   progressivo di release dell'anno (NON il mese)
    //     P   patch; si scrive solo quando serve, oppure a zero se serve W
    //     W   revisione del SOLO wrapper (1..9), a parita' di PWA incorporata.
    //         Esiste solo nei wrapper separati come questo: nei repo dove app
    //         e PWA condividono un unico numero (Tabellone PWA, Classificazione)
    //         W non si usa.
    //     bN  beta (alpha aN, release candidate RCN)
    //
    // Il numero rispecchia la PWA incorporata: PWA 26.1.2 -> Cast 26.1.2. Un
    // fix del solo wrapper (nativo, icone, CI, firma, dipendenze) aggiunge W
    // senza toccare le cifre della PWA: 26.1.2 -> 26.1.2.1 -> 26.1.2.2, e W
    // torna a 0 al re-sync successivo.
    //
    // versionCode a 9 cifre, AA MM PP W BB:
    //   26.1.2    -> 260102099      26.1.2b1  -> 260102001
    //   26.1.2.1  -> 260102199      26.2      -> 260200099
    // BB e' il contatore unico delle pre-release (01..98) e 99 per la finale,
    // quindi ogni beta sta sotto la propria finale e il numero cresce sempre,
    // come richiede Google Play. La 26.1 e la 26.1.1 usavano lo schema
    // precedente a 6 cifre (260100, 260101): il passaggio a 9 cifre e' in
    // avanti, quindi resta compatibile con lo store.
    //
    // NB: i valori qui sotto sono scritti come LETTERALI di proposito —
    // fdroidserver li legge staticamente da questo file, e un valore calcolato
    // non sarebbe riconosciuto. Per evitare disallineamenti a mano c'e' il
    // controllo automatico piu' sotto: se un numero non torna, la build si ferma.
    def pwaVersion = "26.1.2"   // PWA realmente incorporata in assets/pwa/
    def targetPwa  = "26.1.2"   // PWA che questa versione rispecchia (= pwaVersion
                                // dopo il re-sync; durante una beta puo' precederlo)
    def wrapper    = 0          // W: >0 solo per modifiche al solo wrapper
    def beta       = 0          // 0 = release finale; N>0 = beta "bN"
    def appVersion = "26.1.2"   // targetPwa (+ ".W" se W>0) (+ "bN" se beta>0)

    defaultConfig {
        applicationId "io.github.baskinsoftware.tabellonebaskineisicast"
        minSdk 21
        targetSdk 34
        versionCode 260102099
        versionName appVersion

        // esposte al codice/BuildConfig per un'eventuale schermata "Info"
        buildConfigField "String", "APP_VERSION", "\"${appVersion}\""
        buildConfigField "String", "PWA_VERSION", "\"${pwaVersion}\""
    }

    // ── Controllo di coerenza delle versioni ─────────────────────────────────
    // Verifica che appVersion e versionCode rispettino la regola qui sopra a
    // partire da targetPwa + wrapper + beta. Sbagliare un numero durante un
    // re-sync diventa un errore di build, non un bug scoperto sullo store.
    // Niente regex di proposito: in Groovy una regex "slashy" che finisce con
    // il dollaro confina con la sintassi delle stringhe $/.../$ ed e' un
    // inciampo noto, quindi appVersion si divide a mano.
    def _bPos  = appVersion.indexOf('b')
    def _base  = _bPos < 0 ? appVersion : appVersion.substring(0, _bPos)
    def _betaS = _bPos < 0 ? "" : appVersion.substring(_bPos + 1)
    if (_base.isEmpty() || !_base.tokenize('.').every { it.isInteger() } ||
        (_bPos >= 0 && !_betaS.isInteger())) {
        throw new GradleException(
            "appVersion='${appVersion}' non rispetta il formato AA.M[.P][.W][bN].")
    }
    def _betaN = _betaS.isEmpty() ? 0 : _betaS.toInteger()
    if (_betaN != beta) {
        throw new GradleException(
            "Beta non allineata: appVersion='${appVersion}' indica " +
            "${_betaN == 0 ? 'una release finale' : 'la beta ' + _betaN} " +
            "ma beta = ${beta}.")
    }

    // La base di appVersion e' targetPwa, piu' ".W" se W>0. Quando targetPwa ha
    // solo due cifre la P va scritta a zero per fare posto a W, come vuole la
    // regola: PWA 26.1 + W 1 -> "26.1.0.1" (e non "26.1.1", che significa
    // invece la patch 1 della PWA).
    def _attesoBase = targetPwa
    if (wrapper > 0) {
        if (targetPwa.tokenize('.').size() < 3) _attesoBase += ".0"
        _attesoBase += ".${wrapper}"
    }
    if (_base != _attesoBase) {
        throw new GradleException(
            "Versioni non allineate: appVersion='${appVersion}' ha base '${_base}', " +
            "ma da targetPwa ${targetPwa} + W ${wrapper} risulta '${_attesoBase}'.")
    }

    def _t = targetPwa.tokenize('.').collect { it.toInteger() }
    def _tM = _t.size() > 1 ? _t[1] : 0
    def _tP = _t.size() > 2 ? _t[2] : 0
    if (_t[0] > 99 || _tM > 99 || _tP > 99) {
        throw new GradleException(
            "AA, M e P devono stare in due cifre: targetPwa ${targetPwa}.")
    }
    if (wrapper > 9) {
        throw new GradleException("W deve stare in una cifra (0..9): ${wrapper}.")
    }
    if (beta > 98) {
        throw new GradleException(
            "Il contatore delle pre-release arriva a 98 (99 e' la finale): beta ${beta}.")
    }
    def _attesoCode = _t[0] * 10000000 + _tM * 100000 + _tP * 1000 +
                      wrapper * 100 + (beta == 0 ? 99 : beta)
    if (defaultConfig.versionCode != _attesoCode) {
        throw new GradleException(
            "versionCode non allineato: ${defaultConfig.versionCode}, atteso " +
            "${_attesoCode} (da targetPwa ${targetPwa} + W ${wrapper} + beta ${beta}).")
    }

    // Parallelismo con la PWA davvero incorporata: obbligatorio sulle release
    // finali, solo un avviso durante una beta (il re-sync puo' arrivare dopo).
    if (pwaVersion != targetPwa) {
        def _msg = "la PWA incorporata e' ${pwaVersion} ma questa versione punta a " +
                   "${targetPwa}."
        if (_betaN == 0) {
            throw new GradleException("Versioni non parallele: ${_msg}")
        }
        logger.warn("ATTENZIONE: ${_msg} Ri-sincronizzare la PWA prima della release finale.")
    }

    buildFeatures {
        buildConfig true
    }

    // ── Firma della release (convenzione allineata alla PWA) ─────────────────
    // Dalla 26.1.1 i nomi delle variabili d'ambiente sono gli stessi dell'app
    // Android della PWA (prefisso TBE_), così i due progetti si firmano nello
    // stesso modo e gli stessi passi di CI valgono per entrambi:
    //
    //   TBE_KEYSTORE_PATH       percorso del keystore .jks
    //   TBE_KEYSTORE_PASSWORD   password dello store
    //   TBE_KEY_ALIAS           alias della chiave
    //   TBE_KEY_PASSWORD        password della chiave
    //
    // I SEGRETI del repository restano invariati (KEYSTORE_BASE64,
    // KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD): cambia solo il nome con cui
    // i workflow li passano a Gradle.
    //
    // Il signingConfig ora NON viene nemmeno dichiarato quando il keystore
    // manca: prima esisteva sempre, vuoto, ed era la causa dell'errore
    // "Tag number over 30 is not supported" quando il file del keystore era
    // assente o vuoto. Senza la variabile la build release esce non firmata
    // (è il caso di beta.yml e delle build in locale).
    def ksPath = System.getenv("TBE_KEYSTORE_PATH")
    signingConfigs {
        if (ksPath) {
            release {
                storeFile file(ksPath)
                storePassword System.getenv("TBE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("TBE_KEY_ALIAS")
                keyPassword System.getenv("TBE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // le build di debug portano il suffisso "-beta" nel versionName
            versionNameSuffix "-beta"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (ksPath) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    // web server integrato per la modalità sola visualizzazione (LAN + display secondario)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // generazione QR (Apache-2.0) per collegare un TV via browser
    implementation 'com.google.zxing:core:3.5.3'
}
