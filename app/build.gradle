plugins {
    id 'com.android.application'
}

android {
    namespace 'it.uncledan.baskintabellonecast'
    compileSdk 34

    // ── Doppia versione: framework nativo + PWA incorporata ──────────────────
    // Convenzione (dalla 1.1.0 in poi): il versionName mostra ENTRAMBE, così
    // dall'"info app" di Android si legge sia la versione del framework sia
    // quella della PWA. Aggiornare 'pwaVersion' ad ogni re-sync degli assets.
    // NB: dalla PWA 2026 in poi l'upstream è passato a uno schema di versione
    // PER ANNO (es. "2026") invece del semver (era "1.19.0" ecc.): pwaVersion
    // ora rispecchia esattamente quello che riporta l'upstream, non è più un
    // x.y.z nostro.
    def frameworkVersion = "1.3.0"
    def pwaVersion = "2026"
    // versionName composto ATTIVO: es. "1.3.0 (PWA 2026)"

    defaultConfig {
        applicationId "it.uncledan.baskintabellonecast"
        minSdk 21
        targetSdk 34
        // 10300 = framework 1.3.0 (schema major_minor_patch: 1_03_00). Salto di
        // minor perché questa release rinomina il progetto in "Tabellone Baskin
        // EISI (Cast)" (repo tabellone-baskin-eisi-cast) oltre al re-sync PWA,
        // non solo un re-sync. Prossimo minor 1.4.0 -> 10400.
        versionCode 10300
        versionName "${frameworkVersion} (PWA ${pwaVersion})"

        // esposte al codice/BuildConfig per un'eventuale schermata "Info"
        buildConfigField "String", "FRAMEWORK_VERSION", "\"${frameworkVersion}\""
        buildConfigField "String", "PWA_VERSION", "\"${pwaVersion}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // Firma attiva solo se sono presenti le variabili d'ambiente (es. in CI
            // GitHub Actions). In locale, senza variabili, il build non è firmato.
            def ksFile = System.getenv("KEYSTORE_FILE")
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // le build di debug portano il suffisso "-beta" nel versionName
            versionNameSuffix "-beta"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    // web server integrato per la modalità sola visualizzazione (LAN + display secondario)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // generazione QR (Apache-2.0) per collegare un TV via browser
    implementation 'com.google.zxing:core:3.5.3'
}
