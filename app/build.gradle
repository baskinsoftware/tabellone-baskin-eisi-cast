plugins {
    id 'com.android.application'
}

android {
    namespace 'it.uncledan.baskintabellonecast'
    compileSdk 34

    // ── Versione: <versione>.<sottoversione>.<patch> ─────────────────────────
    // La VERSIONE (major) è allineata all'anno della PWA incorporata: la PWA
    // usa uno schema per anno (2026a, 2026b, ...), quindi per tutto il 2026 il
    // Cast sta nella serie 26.x. Dal 2027 si passerà a 27.x.
    //
    //   26.0     prima release della serie 2026
    //   26.1     release successiva (tipicamente un nuovo re-sync della PWA)
    //   26.1.1   modifica al SOLO Cast (fix nativo, CI, dipendenze), PWA invariata
    //
    // La SOTTOVERSIONE avanza ad ogni release; la PATCH (terza cifra, omessa
    // quando è 0) serve alle correzioni che non cambiano la PWA incorporata.
    //
    // versionCode: anno*10000 + sottoversione*100 + patch. Sempre crescente,
    // come richiede Google Play, con margine ampio (99 sottoversioni, 99 patch).
    //   26.0     -> 260000
    //   26.1     -> 260100
    //   26.1.1   -> 260101
    //   27.0     -> 270000
    def appVersion = "26.0"
    // PWA incorporata: non entra nel versionName, ma resta esposta come
    // BuildConfig.PWA_VERSION, utile per assistenza e diagnostica.
    def pwaVersion = "2026g"

    defaultConfig {
        applicationId "it.uncledan.baskintabellonecast"
        minSdk 21
        targetSdk 34
        // 260000 = 26.0 (anno 26, sottoversione 0, patch 0). Vedi la regola sopra.
        // Il vecchio schema arrivava a 10303 (framework 1.3.3): il salto a
        // 260000 è voluto e resta monotòno crescente.
        versionCode 260000
        versionName appVersion

        // esposte al codice/BuildConfig per un'eventuale schermata "Info"
        buildConfigField "String", "APP_VERSION", "\"${appVersion}\""
        buildConfigField "String", "PWA_VERSION", "\"${pwaVersion}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // Firma attiva solo se sono presenti le variabili d'ambiente (es. in CI
            // GitHub Actions). In locale, senza variabili, il build non è firmato.
            def ksFile = System.getenv("KEYSTORE_FILE")
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // le build di debug portano il suffisso "-beta" nel versionName
            versionNameSuffix "-beta"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    // web server integrato per la modalità sola visualizzazione (LAN + display secondario)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // generazione QR (Apache-2.0) per collegare un TV via browser
    implementation 'com.google.zxing:core:3.5.3'
}
